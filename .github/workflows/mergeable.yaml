name: ↪️ Mergeable

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  check_changes:
    name: 📍 Check file changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - id: check
        run: |
          if git diff ${{ github.base_ref }} HEAD --quiet -- backend/ .github/workflows/_test_backend.yaml; then
            echo "backend=false" >> $GITHUB_OUTPUT
          else
            echo "backend=true" >> $GITHUB_OUTPUT
          fi
          if git diff ${{ github.base_ref }} HEAD --quiet -- frontend/ .github/workflows/_test_frontend.yaml; then
            echo "frontend=false" >> $GITHUB_OUTPUT
          else
            echo "frontend=true" >> $GITHUB_OUTPUT
          fi

  test_backend:
    name: ⚙️ Run BE tests
    needs: check_changes
    if: needs.check_changes.outputs.backend == 'true'
    uses: ./.github/workflows/_test_backend.yaml
    secrets: inherit

  test_frontend:
    name: 🖥️ Run FE tests
    needs: check_changes
    if: needs.check_changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_test_frontend.yaml
    secrets: inherit

  mergeable:
    name: ❓ Mergeable
    needs: [check_changes, test_backend, test_frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate mergeability
        run: |
          # If any required job failed, fail this job
          if [[ "${{ needs.test_backend.result }}" == "failure" ]] || [[ "${{ needs.test_frontend.result }}" == "failure" ]]; then
            echo "Required tests failed"
            exit 1
          fi
          echo "PR is mergeable"
